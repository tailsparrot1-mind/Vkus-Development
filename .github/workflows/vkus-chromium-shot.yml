name: Vkus Chromium Screenshot
on:
  push:
    branches: [VKUS]
    paths:
      - '.github/workflows/vkus-chromium-shot.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture published Vkus store
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            await page.goto('https://raw.githack.com/tailsparrot1-mind/Vkus-Development/VKUS/Vkus_Store_PC/index_logo_fullscreen.html?shot=20261115',{waitUntil:'networkidle',timeout:120000});
            await page.screenshot({path:'vkus-chromium.png',fullPage:true});
            console.log('TITLE:',await page.title());
            console.log('URL:',page.url());
            console.log('BODY:',(await page.locator('body').innerText()).slice(0,1000));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vkus-chromium-screenshot
          path: vkus-chromium.png
          if-no-files-found: error

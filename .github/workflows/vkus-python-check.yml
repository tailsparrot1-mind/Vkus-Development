name: Vkus visual and Python checks

on:
  push:
    branches: [VKUS]
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth x11-utils

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r Vkus_3.17_NATIVE_EXCHANGE/requirements.txt

      - name: Compile all Python modules
        run: .venv/bin/python -m compileall -q Vkus_3.17_NATIVE_EXCHANGE

      - name: Render the actual Tkinter Exchange window
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python tools/render_exchange_preview.py --output artifacts/Vkus_3.17_Exchange.png

      - name: Package runnable Vkus source archive
        run: |
          cd Vkus_3.17_NATIVE_EXCHANGE
          chmod +x run.sh install.sh
          find . -type f ! -path '*/__pycache__/*' ! -name '*.pyc' -print | zip -q ../artifacts/Vkus_3.17_NATIVE_EXCHANGE.zip -@

      - name: Upload screenshot and runnable source archive
        uses: actions/upload-artifact@v4
        with:
          name: Vkus-3.17-Exchange-build
          path: |
            artifacts/Vkus_3.17_Exchange.png
            artifacts/Vkus_3.17_NATIVE_EXCHANGE.zip
          if-no-files-found: error
          retention-days: 14

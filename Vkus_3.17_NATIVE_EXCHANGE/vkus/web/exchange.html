<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vkus — Биржа спроса и предложений</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020516;font-family:Arial,Helvetica,sans-serif;color:#edf3ff}
#viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw,177.6833vh);height:min(100vh,56.2787vw);aspect-ratio:1672/941;overflow:hidden;background:#020516}
#reference{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.hot{position:absolute;border:0;background:transparent;color:inherit;cursor:pointer;outline:none}
.hot:focus-visible{outline:2px solid #32dfff;outline-offset:2px;border-radius:12px}
#query{left:19.14%;top:46.23%;width:50.45%;height:5.53%;padding:0 1.35%;border:1px solid rgba(104,145,255,.58);border-radius:14px;background:rgba(8,19,48,.96);color:#f3f6ff;font-size:clamp(10px,1.18vw,20px);box-shadow:inset 0 0 18px #173c7555}
#query::placeholder{color:#98a9d1}#find{left:70.38%;top:46.25%;width:8.85%;height:5.5%;border-radius:13px}
.filter{top:53.08%;height:4.2%;border-radius:18px}.filter:hover{background:#5b70ff22}.f1{left:19.13%;width:9.45%}.f2{left:29.25%;width:11.5%}.f3{left:41.65%;width:11.5%}.f4{left:54.0%;width:11.7%}
.source{top:64.7%;height:8.65%;border-radius:18px}.source:hover{background:#5b70ff18}.source.selected{box-shadow:0 0 0 2px #c13cff,0 0 18px #a020ff, inset 0 0 16px #9b26ff55}.s1{left:18.0%;width:7.9%}.s2{left:26.5%;width:8.15%}.s3{left:35.3%;width:8.15%}.s4{left:44.0%;width:8.2%}.s5{left:52.9%;width:8.8%}.s6{left:62.1%;width:8.6%}.s7{left:71.7%;width:8.5%}
#more{left:71.7%;top:64.7%;width:8.5%;height:8.65%;border-radius:18px}
#help{left:81.5%;top:39.7%;width:15.4%;height:34.9%;border-radius:20px}
#settings{left:80.6%;top:90.9%;width:8.0%;height:3.0%;border-radius:12px}
#navMessages{left:.8%;top:40.1%;width:14.1%;height:6.2%}#navSearch{left:.8%;top:46.2%;width:14.1%;height:6.2%}#navExchange{left:.8%;top:52.0%;width:14.1%;height:6.3%}#navMonitor{left:.8%;top:58.2%;width:14.1%;height:6.2%}#navSettings{left:.8%;top:64.3%;width:14.1%;height:6.2%}
#toast{position:absolute;left:37%;bottom:2.5%;max-width:48%;padding:12px 18px;border:1px solid #a43dff;border-radius:14px;background:rgba(8,10,39,.97);box-shadow:0 0 24px #7625ff88;color:#eaf3ff;font-size:clamp(10px,.85vw,14px);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:none}
#menu{position:absolute;z-index:5;display:none;min-width:190px;padding:8px;border:1px solid #7842ff;border-radius:13px;background:#080d2af5;box-shadow:0 0 25px #6d20ff88;font-size:clamp(10px,.8vw,14px)}#menu button{display:block;width:100%;padding:9px;border:0;border-radius:8px;background:transparent;color:#edf3ff;text-align:left;cursor:pointer}#menu button:hover{background:#5521a8}
#modal{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:#020617b8}#modal.open{display:flex}.dialog{width:48%;padding:2%;border:1px solid #7b3dff;border-radius:20px;background:linear-gradient(135deg,#11113bfa,#061c38fa);box-shadow:0 0 45px #6d24ff88}.dialog h2{margin:0 0 14px;font-size:clamp(15px,1.4vw,24px)}.dialog p{color:#c2d4f7;font-size:clamp(11px,.9vw,15px);line-height:1.5}.dialog button{border:1px solid #9345ff;border-radius:10px;padding:9px 18px;background:linear-gradient(100deg,#8d20ef,#174dff);color:white;cursor:pointer}
</style></head>
<body><div id="viewport"><main id="stage" aria-label="Vkus — Биржа спроса и предложений">
<img id="reference" src="../assets/birzha_reference.png" alt="">
<input id="query" autocomplete="off" placeholder="Например: ремонт компьютера, настройка рекламы, доставка..." aria-label="Что ищем">
<button id="find" class="hot" aria-label="Найти"></button>
<button class="hot filter f1" data-menu="Город|Оренбург|Орск|Москва|Санкт-Петербург|Екатеринбург" aria-label="Выбрать город"></button>
<button class="hot filter f2" data-menu="Радиус|10 км|25 км|50 км|100 км|Вся страна" aria-label="Радиус поиска"></button>
<button class="hot filter f3" data-menu="Период|За сутки|За 7 дней|За 30 дней|За 3 месяца|За всё время" aria-label="Период поиска"></button>
<button class="hot filter f4" data-menu="Категория|Все категории|Услуги и ремонт|Работа и вакансии|Покупка и продажа|Разовые задачи|Помощь и специалисты" aria-label="Категория"></button>
<button class="hot source s1" data-source="VK" aria-label="Источник VK"></button><button class="hot source s2" data-source="Telegram" aria-label="Источник Telegram"></button><button class="hot source s3 selected" data-source="Avito" aria-label="Источник Avito"></button><button class="hot source s4" data-source="YouDo" aria-label="Источник YouDo"></button><button class="hot source s5" data-source="Профи.ру" aria-label="Источник Профи.ру"></button><button class="hot source s6" data-source="Форумы" aria-label="Источник Форумы"></button><button id="more" class="hot" aria-label="Ещё источники"></button>
<button id="navMessages" class="hot" aria-label="Сообщения"></button><button id="navSearch" class="hot" aria-label="Поиск"></button><button id="navExchange" class="hot" aria-label="Биржа"></button><button id="navMonitor" class="hot" aria-label="Мониторинг"></button><button id="navSettings" class="hot" aria-label="Настройки"></button>
<button id="settings" class="hot" aria-label="Настроить анализ"></button><button id="help" class="hot" aria-label="Что можно найти"></button>
<div id="menu"></div><div id="toast" role="status"></div>
<div id="modal"><div class="dialog"><h2>Источники Vkus</h2><p>Визуальная вкладка повторяет утверждённый макет. Подключение источников и получение актуальных публикаций — отдельный этап интеграции; демонстрационные цифры и карточки на фоне не являются результатами реального поиска.</p><button id="closeModal">Понятно</button></div></div>
</main></div>
<script>
const stage=document.querySelector('#stage'),toast=document.querySelector('#toast'),menu=document.querySelector('#menu');let toastTimer;
function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function placeMenu(el,items){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();menu.innerHTML=items.map((v,i)=>`<button data-value="${v.replaceAll('"','&quot;')}">${v}</button>`).join('');menu.style.left=((r.left-s.left)/s.width*100)+'%';menu.style.top=((r.bottom-s.top)/s.height*100+0.5)+'%';menu.style.display='block';menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{notify('Выбрано: '+b.dataset.value);menu.style.display='none'})}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>placeMenu(b,b.dataset.menu.split('|').slice(1)));
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');notify(b.dataset.source+(b.classList.contains('selected')?' — включён':' — выключен'))});
document.querySelector('#more').onclick=()=>notify('Дополнительные источники: Google, Яндекс, Работа.ру, объявления и отраслевые площадки — подключаются отдельно.');
document.querySelector('#find').onclick=()=>{const q=document.querySelector('#query').value.trim();if(!q){notify('Введите потребность или услугу для поиска.');return}const src=[...document.querySelectorAll('[data-source].selected')].map(x=>x.dataset.source);if(!src.length){notify('Выберите хотя бы один источник.');return}notify('Запрос подготовлен: «'+q+'». Источники: '+src.join(', ')+'. Реальный сбор ещё не подключён.')};
document.querySelector('#query').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#find').click()});
document.querySelector('#settings').onclick=()=>document.querySelector('#modal').classList.add('open');document.querySelector('#closeModal').onclick=()=>document.querySelector('#modal').classList.remove('open');
document.querySelector('#help').onclick=()=>notify('Vkus ищет заявки на услуги, разовые задачи, вакансии, товары и предложения специалистов.');
document.querySelector('#navExchange').onclick=()=>notify('Вы уже в разделе «Биржа».');
for(const id of ['navMessages','navSearch','navMonitor','navSettings'])document.getElementById(id).onclick=()=>notify('Раздел «'+({navMessages:'Сообщения',navSearch:'Поиск',navMonitor:'Мониторинг',navSettings:'Настройки'}[id])+'» остаётся в основном приложении Vkus.');
document.addEventListener('click',e=>{if(!e.target.closest('[data-menu]')&&!e.target.closest('#menu'))menu.style.display='none'});
</script></body></html>
